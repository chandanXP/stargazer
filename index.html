<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Celestial VR Explorer</title>

  <!-- Load A-Frame from CDN -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    /* Hide the default A-Frame VR button text for a cleaner look */
    .a-enter-vr { display: none; }
  </style>
</head>
<body>

  <a-scene
    background="color: #000"
    fog="type: exponential; color: #000; density: 0.001"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable; far: 1000"
  >

    <!-- ==================== ASSETS ==================== -->
    <a-assets>
      <!-- Procedural star field (using a simple gradient sphere as a sky) -->
      <img id="skyTexture" src="https://cdn.aframe.io/aframe/examples/boilerplate/panorama.jpg" crossorigin="anonymous" />

      <!-- Planet textures (public domain / NASA-like images from A-Frame examples) -->
      <img id="sunTex"      src="https://cdn.aframe.io/aframe/examples/boilerplate/panorama.jpg" crossorigin="anonymous" />
      <img id="earthTex"    src="https://cdn.aframe.io/aframe/examples/boilerplate/panorama.jpg" crossorigin="anonymous" />
      <img id="marsTex"     src="https://cdn.aframe.io/aframe/examples/boilerplate/panorama.jpg" crossorigin="anonymous" />
      <img id="jupiterTex"  src="https://cdn.aframe.io/aframe/examples/boilerplate/panorama.jpg" crossorigin="anonymous" />
      <img id="saturnTex"   src="https://cdn.aframe.io/aframe/examples/boilerplate/panorama.jpg" crossorigin="anonymous" />

      <!-- For a more realistic look, replace the above with actual planet textures:
           e.g., https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg
           (Note: ensure CORS is allowed or download the textures locally.) -->
    </a-assets>

    <!-- ==================== SKY ==================== -->
    <a-sky src="#skyTexture" rotation="0 -130 0"></a-sky>

    <!-- ==================== CAMERA RIG ==================== -->
    <!-- The rig allows movement; the camera handles look‑around (gyro on mobile). -->
    <a-entity id="rig" position="0 1.6 0">
      <a-entity id="camera" camera look-controls wasd-controls position="0 0 0">
        <!-- Gaze cursor for selection -->
        <a-entity
          cursor="fuse: true; fuseTimeout: 800"
          raycaster="objects: .clickable; far: 1000"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
          material="color: #FFF; opacity: 0.8"
          animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 0.5 0.5 0.5; dur: 800"
          animation__mouseleave="property: scale; startEvents: mouseleave; from: 0.5 0.5 0.5; to: 1 1 1; dur: 200"
        ></a-entity>
      </a-entity>
    </a-entity>

    <!-- ==================== INFO PANEL ==================== -->
    <!-- This panel appears when a celestial object is selected. -->
    <a-entity id="infoPanel" visible="false" position="0 1.5 -2" geometry="primitive: plane; width: 1.5; height: 0.8" material="color: #111; opacity: 0.9">
      <a-text id="infoTitle" value="Object Name" align="center" width="1.4" position="0 0.25 0.01" color="#FFD700"></a-text>
      <a-text id="infoDesc" value="Description goes here." align="center" width="1.4" wrap-count="40" position="0 0 0.01" color="#FFF"></a-text>
      <!-- Close button -->
      <a-entity
        id="closeBtn"
        geometry="primitive: plane; width: 0.3; height: 0.1"
        material="color: #900"
        position="0 -0.35 0.01"
        text="value: CLOSE; align: center; width: 0.28; color: #FFF"
        class="clickable"
      ></a-entity>
    </a-entity>

    <!-- ==================== CELESTIAL OBJECTS ==================== -->
    <!-- Each object has class="clickable" and a data‑ attribute for its info. -->

    <!-- SUN -->
    <a-sphere
      id="sun"
      class="clickable"
      data-name="Sun"
      data-desc="The Sun is a G-type main-sequence star at the center of the Solar System. It contains 99.86% of the system's mass and is the source of light and heat for all planets."
      position="0 1.5 -8"
      radius="1.5"
      material="color: #FFD700; emissive: #FF8C00; emissiveIntensity: 1.5"
    ></a-sphere>

    <!-- EARTH -->
    <a-sphere
      id="earth"
      class="clickable"
      data-name="Earth"
      data-desc="Earth is the third planet from the Sun and the only astronomical object known to harbor life. About 71% of its surface is covered with water."
      position="4 1.2 -6"
      radius="0.8"
      material="src: #earthTex; color: #2E8B57"
    ></a-sphere>

    <!-- MARS -->
    <a-sphere
      id="mars"
      class="clickable"
      data-name="Mars"
      data-desc="Mars is the fourth planet from the Sun. It is a dusty, cold, desert world with a very thin atmosphere. Evidence suggests it once had liquid water on its surface."
      position="-4 1.8 -7"
      radius="0.6"
      material="color: #C1440E"
    ></a-sphere>

    <!-- JUPITER -->
    <a-sphere
      id="jupiter"
      class="clickable"
      data-name="Jupiter"
      data-desc="Jupiter is the largest planet in the Solar System. It is a gas giant with a mass more than two and a half times that of all the other planets combined."
      position="6 0.5 -12"
      radius="1.2"
      material="color: #D8A47F"
    ></a-sphere>

    <!-- SATURN (with a simple ring) -->
    <a-entity position="-6 1.0 -14">
      <a-sphere
        class="clickable"
        data-name="Saturn"
        data-desc="Saturn is the sixth planet from the Sun and the second-largest in the Solar System. It is a gas giant with a prominent ring system made mostly of ice particles."
        radius="1.0"
        material="color: #F4C430"
      ></a-sphere>
      <a-ring
        radius-inner="1.2"
        radius-outer="2.0"
        rotation="-90 0 0"
        material="color: #E0C080; opacity: 0.6; side: double"
      ></a-ring>
    </a-entity>

    <!-- NEBULA (a coloured cloud‑like sphere) -->
    <a-sphere
      id="nebula"
      class="clickable"
      data-name="Orion Nebula"
      data-desc="The Orion Nebula is a diffuse nebula situated in the Milky Way. It is one of the brightest nebulae and is visible to the naked eye in the night sky."
      position="2 3 -20"
      radius="3"
      material="color: #8A2BE2; opacity: 0.4; transparent: true; emissive: #4B0082"
    ></a-sphere>

    <!-- BLACK HOLE (a dark sphere with a glowing ring) -->
    <a-entity position="-3 2 -25">
      <a-sphere
        class="clickable"
        data-name="Black Hole"
        data-desc="A black hole is a region of spacetime where gravity is so strong that nothing—no particles or even electromagnetic radiation such as light—can escape from it."
        radius="1.5"
        material="color: #000; shader: flat"
      ></a-sphere>
      <a-torus
        radius="2.2"
        radius-tubular="0.15"
        rotation="90 0 0"
        material="color: #FF4500; emissive: #FF4500; opacity: 0.8"
      ></a-torus>
    </a-entity>

    <!-- DISTANT STARS (procedurally placed tiny spheres) -->
    <a-entity id="starField">
      <a-sphere position="10 10 -30" radius="0.2" material="color: #FFF; emissive: #FFF"></a-sphere>
      <a-sphere position="-15 5 -35" radius="0.15" material="color: #FFF; emissive: #FFF"></a-sphere>
      <a-sphere position="20 -5 -40" radius="0.25" material="color: #FFF; emissive: #FFF"></a-sphere>
      <a-sphere position="-8 -10 -50" radius="0.1" material="color: #FFF; emissive: #FFF"></a-sphere>
      <a-sphere position="5 15 -60" radius="0.2" material="color: #FFF; emissive: #FFF"></a-sphere>
      <!-- Add more stars as needed... -->
    </a-entity>

  </a-scene>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    // Wait for A-Frame to load
    AFRAME.registerComponent('info-interaction', {
      init: function () {
        const scene = this.el.sceneEl;
        const infoPanel = document.querySelector('#infoPanel');
        const infoTitle = document.querySelector('#infoTitle');
        const infoDesc = document.querySelector('#infoDesc');
        const closeBtn = document.querySelector('#closeBtn');

        // Function to show info
        function showInfo(name, desc) {
          infoTitle.setAttribute('value', name);
          infoDesc.setAttribute('value', desc);
          infoPanel.setAttribute('visible', true);
        }

        // Listen for clicks on any clickable object
        scene.addEventListener('click', function (evt) {
          const target = evt.target;
          if (target.classList.contains('clickable')) {
            const name = target.dataset.name || 'Unknown';
            const desc = target.dataset.desc || 'No description available.';
            showInfo(name, desc);
          }
        });

        // Close button hides the panel
        closeBtn.addEventListener('click', function () {
          infoPanel.setAttribute('visible', false);
        });
      }
    });

    // Register the component on the scene
    document.addEventListener('DOMContentLoaded', function () {
      const scene = document.querySelector('a-scene');
      scene.setAttribute('info-interaction', '');
    });
  </script>

</body>
</html>
