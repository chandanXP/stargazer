<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04060c">
<title>Sky VR · Shahdol Sky Atlas</title>
<style>
  :root{
    --bg:#04060c; --ink:#e8ecf6; --mute:#8d98b4; --amber:#ffc26b; --line:#2a3552;
    --glass:rgba(12,17,30,.72); --cyan:#67e8f9; --rose:#fb7185; --violet:#a78bfa;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 "Avenir Next",system-ui,-apple-system,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #gl,#overlay{position:fixed;inset:0;width:100%;height:100%;display:block}
  #overlay{pointer-events:none}
  #gl{cursor:grab}
  #gl:active{cursor:grabbing}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;
    display:flex;gap:16px;pointer-events:none;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);
    text-shadow:0 1px 8px #000a; z-index:5;
  }
  #hud div{display:grid;gap:1px}
  #hud span{opacity:.6}
  #hud b{
    color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:.06em;font-size:12px;
  }
  #brand{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;
    font-size:11px;letter-spacing:.42em;color:#ffffff55;pointer-events:none;
    text-shadow:0 1px 8px #000a; z-index:5;
  }

  /* ---------- Info panel ---------- */
  #info{
    position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 54px);
    width:min(310px,calc(100% - 28px));max-height:calc(100vh - 160px);
    background:var(--glass);border:1px solid var(--line);border-radius:18px;
    padding:14px 16px;overflow-y:auto;
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    box-shadow:0 24px 60px -24px #000, inset 0 1px 0 #ffffff14;
    z-index:6;display:none;font-size:13px;
  }
  #info.open{display:block;animation:slideIn .25s ease}
  @keyframes slideIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  #info h2{margin:0 0 2px;font-size:16px;letter-spacing:.04em;color:var(--amber)}
  #info .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
  #info .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer;padding:4px}
  #info .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #ffffff0a}
  #info .row:last-child{border:0}
  #info .k{color:var(--mute);font-size:11px;letter-spacing:.06em}
  #info .v{color:var(--ink);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
  #info .desc{margin-top:10px;font-size:12px;color:#b8c2d8;line-height:1.5}
  #info .loading{color:var(--mute);font-size:12px;font-style:italic}

  /* ---------- Control bar ---------- */
  #bar{
    position:fixed;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    display:flex;justify-content:center;padding:0 12px;pointer-events:none;
    z-index:5;
  }
  .panel{
    pointer-events:auto;display:flex;flex-direction:column;gap:10px;
    background:var(--glass);border:1px solid var(--line);border-radius:20px;
    padding:12px 16px;max-width:min(780px,100%);
    backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 24px 60px -24px #000, inset 0 1px 0 #ffffff14;
  }
  .row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .lab{font-size:10px;letter-spacing:.18em;color:var(--mute)}
  .clock{
    color:var(--amber);font-size:12px;font-weight:600;
    font-variant-numeric:tabular-nums;min-width:46px;text-align:right;
  }

  button{
    appearance:none;-webkit-appearance:none;
    background:#0e1424d9;color:var(--ink);
    border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font:inherit;font-size:13px;letter-spacing:.03em;
    cursor:pointer;
    transition:background .18s,border-color .18s,color .18s,transform .12s;
  }
  button:hover{background:#161f36;border-color:#3d4b70}
  button:active{transform:scale(.95)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.on{background:#ffc26b1f;border-color:#ffc26b88;color:var(--amber)}

  input[type=range]{
    -webkit-appearance:none;appearance:none;background:transparent;
    flex:1 1 180px;min-width:120px;height:22px;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;
    background:linear-gradient(90deg,#1b2540,#3b4a72 42%,#ffc26b 78%,#2a3552);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;margin-top:-6px;
    border-radius:50%;background:var(--amber);box-shadow:0 0 14px #ffc26b99;
  }
  input[type=range]::-moz-range-track{
    height:4px;border-radius:2px;
    background:linear-gradient(90deg,#1b2540,#3b4a72 42%,#ffc26b 78%,#2a3552);
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border:0;border-radius:50%;
    background:var(--amber);box-shadow:0 0 14px #ffc26b99;
  }

  /* ---------- Intro veil ---------- */
  #veil{
    position:fixed;inset:0;z-index:9;display:grid;place-content:center;
    gap:8px;text-align:center;
    background:radial-gradient(circle at 50% 44%,#0b1224,#04060c 72%);
    transition:opacity .9s ease .1s;
  }
  #veil h1{margin:0;font-size:13px;letter-spacing:.7em;color:var(--amber);font-weight:600}
  #veil p{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
  #veil.gone{opacity:0;pointer-events:none}

  @media (max-width:480px){
    #hud{gap:10px;font-size:9px}
    #hud b{font-size:10px}
    button{padding:7px 10px;font-size:12px}
    #info{width:calc(100% - 20px);right:10px;top:auto;bottom:150px;max-height:40vh}
  }
  @media (prefers-reduced-motion:reduce){
    #veil{transition:none}
    button{transition:none}
    #info.open{animation:none}
  }
</style>
</head>
<body>

<canvas id="gl" aria-label="Sky background"></canvas>
<canvas id="overlay" aria-hidden="true"></canvas>

<div id="hud" aria-hidden="true">
  <div><span>HDG</span><b id="v-hdg">000°</b></div>
  <div><span>PITCH</span><b id="v-pit">+00°</b></div>
  <div><span>SUN</span><b id="v-sun">+00°</b></div>
  <div><span>LAT</span><b>23.29°N</b></div>
  <div><span>LON</span><b>81.36°E</b></div>
  <div><span>FPS</span><b id="v-fps">–</b></div>
</div>

<div id="brand">SKY&nbsp;VR · SHAHDOL</div>

<aside id="info" aria-live="polite">
  <button class="close" id="info-close" aria-label="Close panel">×</button>
  <h2 id="info-name">—</h2>
  <div class="sub" id="info-type">—</div>
  <div id="info-body"></div>
</aside>

<div id="bar">
  <div class="panel">
    <div class="row">
      <label class="lab" for="time">TIME</label>
      <input id="time" type="range" min="0" max="24" step="0.01" value="19.15"
             aria-label="Time of day">
      <b class="clock" id="v-time">19:09</b>
      <button id="b-now" title="Jump to now">Now</button>
    </div>
    <div class="row">
      <button id="b-cycle" class="on" title="Animate the night">Cycle</button>
      <button id="b-drift" class="on" title="Slow camera drift">Drift</button>
      <button id="b-ground" class="on" title="Show ground &amp; horizon">Ground</button>
      <button id="b-grid" class="on" title="RA/Dec &amp; Alt/Az grids">Grid</button>
      <button id="b-names" class="on" title="Object labels">Names</button>
      <button id="b-gyro" title="Device motion">Gyro</button>
      <button id="b-vr" title="Split-screen stereo">VR</button>
      <button id="b-full" title="Fullscreen">Full</button>
      <button id="b-reset" title="Reset view">Reset</button>
    </div>
  </div>
</div>

<div id="veil"><h1>SKY VR · SHAHDOL</h1><p>drag to look · tap an object for facts</p></div>

  }

<script type="module">
import * as Astronomy from 'astronomy-engine';

/* ============================================================
   OBSERVER – SHAHDOL, MADHYA PRADESH, INDIA
   ============================================================ */
const OBSERVER = new Astronomy.Observer(23.2936, 81.3619, 468);
const LOC_NAME = 'Shahdol, IN';

/* ============================================================
   DOM
   ============================================================ */
const glCanvas = document.getElementById('gl');
const ovCanvas = document.getElementById('overlay');
const gl = glCanvas.getContext('webgl', {
  alpha: false, antialias: false, depth: false, stencil: false,
  premultipliedAlpha: false, powerPreference: 'high-performance'
});
const ov = ovCanvas.getContext('2d');

const veil = document.getElementById('veil');
const $ = id => document.getElementById(id);
const elHdg = $('v-hdg'), elPit = $('v-pit'), elSun = $('v-sun'),
      elFps = $('v-fps'), elTime = $('v-time'), slider = $('time');
const infoPanel = $('info'), infoName = $('info-name'),
      infoType = $('info-type'), infoBody = $('info-body');

const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* ============================================================
   STATE
   ============================================================ */
const state = {
  yaw: -1.52,
  pitch: 0.08,
  fov: 72,
  hour: 19.15,
  cloud: 0.55,
  drift: true,
  cycle: true,
  ground: true,
  grid: true,
  names: true,
  stereo: false,
  gyro: false,
  observerDate: new Date(),
  selected: null
};

const DEFAULT = { yaw: -1.52, pitch: 0.08, fov: 72, hour: 19.15 };

/* ============================================================
   WEBGL SKY + GROUND
   ============================================================ */
if (!gl) {
  veil.innerHTML = '<h1>SKY VR</h1><p>WebGL not available</p>';
  throw new Error('WebGL unavailable');
}

const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform vec2  uRes;
uniform vec3  uFwd, uRight, uUp, uSun, uMoon;
uniform float uTanHalf, uTime, uCloud;
uniform float uGround;

float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f); float a=hash12(i),b=hash12(i+vec2(1,0)),c=hash12(i+vec2(0,1)),d=hash12(i+vec2(1,1)); return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<5;i++){v+=a*vnoise(p);p=m*p;a*=.5;} return v; }

void main(){
  float aspect = uRes.x/uRes.y;
  vec2 ndc = vUv*2.0-1.0;
  vec3 dir = normalize(uFwd + uRight*(ndc.x*uTanHalf*aspect) + uUp*(ndc.y*uTanHalf));

  float sunEl = uSun.y;
  float day   = smoothstep(-0.10, 0.25, sunEl);
  float dusk  = smoothstep(-0.42, -0.05, sunEl)*(1.0-smoothstep(-0.02,0.30,sunEl));
  float night = smoothstep(0.08, -0.14, sunEl);

  vec3 zenDay=vec3(0.13,0.33,0.72), zenNight=vec3(0.012,0.020,0.055);
  vec3 horDay=vec3(0.68,0.81,0.95), horNight=vec3(0.030,0.045,0.100);
  vec3 warm=vec3(1.00,0.45,0.14);

  vec3 zen=mix(zenNight,zenDay,day), hor=mix(horNight,horDay,day);
  hor=mix(hor,warm,dusk*0.80); zen=mix(zen,warm*0.55,dusk*0.28);

  float t=clamp(dir.y,0.0,1.0);
  vec3 col=mix(hor,zen,pow(t,0.55));

  /* ---- GROUND ---- */
  float groundY = -0.015;
  if (uGround > 0.5 && dir.y < groundY) {
    float below = smoothstep(groundY, groundY - 0.08, dir.y);
    // earthy gradient: warm dark soil near horizon → deep charcoal at nadir
    vec3 soilNear = vec3(0.085, 0.070, 0.055);
    vec3 soilFar  = vec3(0.018, 0.020, 0.028);
    vec3 gcol = mix(soilNear, soilFar, below);

    // subtle terrain texture
    vec2 gp = dir.xz / (abs(dir.y) + 0.05) * 1.8;
    float tex = fbm(gp * 2.0) * 0.25 + fbm(gp * 7.0) * 0.10;
    gcol += (tex - 0.12) * 0.15 * (1.0 - below*0.6);

    // atmospheric haze at the horizon
    float haze = exp(-abs(dir.y - groundY) * 28.0);
    vec3 hazeCol = mix(vec3(0.16,0.18,0.24), horDay, day);
    gcol = mix(gcol, hazeCol, haze * 0.70);

    col = gcol;
  } else if (uGround > 0.5) {
    // thin haze just above horizon so ground melts into sky
    float haze = exp(-abs(dir.y) * 40.0);
    col = mix(col, mix(vec3(0.10,0.13,0.18), hor, day), haze * 0.35);
  }

  /* ---- horizon glow towards the sun ---- */
  vec3 flatDir=normalize(vec3(dir.x,0.,dir.z)+vec3(1e-5));
  vec3 flatSun=normalize(vec3(uSun.x,0.,uSun.z)+vec3(1e-5));
  float az=max(dot(flatDir,flatSun),0.0);
  col+=warm*pow(az,5.0)*(dusk*0.55+day*0.05)*smoothstep(-0.05,0.18,dir.y);

  /* ---- sun ---- */
  float sd=max(dot(dir,uSun),0.0);
  col+=vec3(1.0,0.70,0.34)*pow(sd,8.0)*0.18;
  col+=vec3(1.0,0.92,0.78)*smoothstep(0.99940,0.99985,sd)*5.0*smoothstep(-0.08,0.02,sunEl);

  /* ---- stars ---- */
  if(night>0.01 && dir.y>-0.05){
    float st=0.0;
    vec3 p1=dir*60.0; vec3 i1=floor(p1); vec3 f1=fract(p1)-0.5;
    float h1=hash13(i1); if(h1>0.982){ float dd=length(f1); st+=smoothstep(0.30,0.0,dd)*2.4; }
    vec3 p2=dir*140.0; vec3 i2=floor(p2); vec3 f2=fract(p2)-0.5;
    float h2=hash13(i2); if(h2>0.960){ float dd=length(f2); st+=smoothstep(0.24,0.0,dd); }
    st*=night*smoothstep(-0.02,0.14,dir.y);
    col+=vec3(0.84,0.90,1.0)*st*1.5;

    /* ---- Milky Way band (enhanced procedural) ---- */
    vec3 galNormal = normalize(vec3(0.42, 0.22, -0.88));
    float band = exp(-pow(dot(dir, galNormal) * 2.2, 2.0));
    if (band > 0.01) {
      float mn = fbm(vec2(atan(dir.z, dir.x) * 2.4, dir.y * 5.2));
      float dust = fbm(vec2(atan(dir.z, dir.x) * 5.5 + 11.0, dir.y * 9.0));
      float structure = smoothstep(0.35, 0.95, mn) * (0.55 + 0.45 * smoothstep(0.3, 0.8, dust));
      float bulge = exp(-pow(length(vec2(atan(dir.z, dir.x) + 0.3, dir.y * 1.6)) * 1.8, 2.0));
      col += vec3(0.36, 0.40, 0.58) * band * structure * night * 0.65;
      col += vec3(0.55, 0.48, 0.40) * band * bulge * night * 0.35;
      col -= vec3(0.04, 0.05, 0.08) * band * smoothstep(0.6, 0.9, dust) * night * 0.5;
    }
  }

  /* ---- moon ---- */
  float md=dot(dir,uMoon);
  float moonUp=smoothstep(-0.02,0.10,uMoon.y);
  col+=vec3(0.90,0.93,1.00)*smoothstep(0.99930,0.99975,md)*2.6*moonUp;
  col+=vec3(0.45,0.55,0.85)*pow(max(md,0.),80.)*0.30*moonUp;

  /* ---- clouds ---- */
  if(uCloud>0.001 && dir.y>0.004){
    vec2 cuv=dir.xz/(dir.y+0.09)*0.62 + vec2(uTime*0.0045,uTime*0.0024);
    float n1=fbm(cuv*1.35), n2=fbm(cuv*3.30+vec2(7.3,2.1));
    float d=n1*0.72+n2*0.34;
    float cov=smoothstep(0.60-uCloud*0.20,0.94-uCloud*0.18,d)*smoothstep(0.,0.18,dir.y);
    if(cov>0.001){
      vec3 cn=normalize(vec3(dir.x,0.42,dir.z));
      vec3 sn=normalize(vec3(uSun.x,0.75,uSun.z));
      float lit=dot(cn,sn)*0.5+0.5;
      vec3 cl=mix(vec3(0.22,0.26,0.38),vec3(1.0,0.96,0.90),lit);
      cl=mix(cl*0.30,cl,day*0.85+dusk*0.45);
      cl=mix(cl,vec3(1.0,0.52,0.24),dusk*0.55*lit);
      cl+=vec3(1.0,0.86,0.62)*pow(sd,24.0)*0.9;
      col=mix(col,cl,cov*0.92);
    }
  }

  vec2 q=vUv-0.5; col*=1.0-dot(q,q)*0.30;
  col+=(hash12(gl_FragCoord.xy+fract(uTime)*61.0)-0.5)*0.006;
  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
}
`;

function makeShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {};
['uRes','uFwd','uRight','uUp','uSun','uMoon','uTanHalf','uTime','uCloud','uGround']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

/* ============================================================
   CELESTIAL CATALOGS
   ============================================================ */

/* Bright stars: name, RA(h), Dec(deg J2000), mag, spectral type */
const STARS = [
  ['Sirius', 6.752, -16.716, -1.46, 'A1V'],
  ['Canopus', 6.399, -52.696, -0.74, 'F0II'],
  ['Arcturus', 14.261, 19.182, -0.05, 'K1III'],
  ['Vega', 18.615, 38.784, 0.03, 'A0V'],
  ['Capella', 5.278, 45.998, 0.08, 'G8III'],
  ['Rigel', 5.242, -8.202, 0.13, 'B8Ia'],
  ['Procyon', 7.655, 5.225, 0.34, 'F5IV'],
  ['Betelgeuse', 5.919, 7.407, 0.50, 'M1Ia'],
  ['Achernar', 1.629, -57.237, 0.46, 'B3V'],
  ['Hadar', 14.064, -60.373, 0.61, 'B1III'],
  ['Altair', 19.846, 8.868, 0.77, 'A7V'],
  ['Aldebaran', 4.599, 16.509, 0.85, 'K5III'],
  ['Antares', 16.490, -26.432, 1.09, 'M1Ib'],
  ['Spica', 13.420, -11.161, 1.04, 'B1III'],
  ['Pollux', 7.755, 28.026, 1.14, 'K0III'],
  ['Fomalhaut', 22.961, -29.622, 1.16, 'A3V'],
  ['Deneb', 20.690, 45.280, 1.25, 'A2Ia'],
  ['Regulus', 10.140, 11.967, 1.35, 'B8IV'],
  ['Castor', 7.577, 31.888, 1.58, 'A1V'],
  ['Bellatrix', 5.418, 6.350, 1.64, 'B2III'],
  ['Elnath', 5.438, 28.608, 1.65, 'B7III'],
  ['Mintaka', 5.533, -0.299, 2.25, 'O9.5II'],
  ['Alnilam', 5.604, -1.202, 1.69, 'B0Ia'],
  ['Alnitak', 5.679, -1.943, 1.74, 'O9.7Ib'],
  ['Saiph', 5.796, -9.670, 2.07, 'B0Ia'],
  ['Dubhe', 11.062, 61.751, 1.79, 'K0III'],
  ['Merak', 11.031, 56.383, 2.37, 'A1V'],
  ['Phecda', 11.897, 53.695, 2.44, 'A0V'],
  ['Megrez', 12.257, 57.033, 3.31, 'A3V'],
  ['Alioth', 12.900, 55.960, 1.77, 'A1III'],

/* ============================================================
   ASTRONOMY HELPERS
   ============================================================ */
function localSiderealTime(date) {
  const jd = Astronomy.MakeTime(date).tt;
  const T = (jd - 2451545.0) / 36525.0;
  let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
           + 0.000387933 * T * T - (T * T * T) / 38710000.0;
  gmst = ((gmst % 360) + 360) % 360;
  const lst = (gmst + OBSERVER.longitude) % 360;
  return lst * DEG;
}

function raDecToAltAz(date, raHours, decDeg) {
  const lst = localSiderealTime(date);
  const ha = lst - (raHours * 15) * DEG;
  const dec = decDeg * DEG;
  const lat = OBSERVER.latitude * DEG;
  const sinAlt = Math.sin(dec) * Math.sin(lat) + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
  const alt = Math.asin(clamp(sinAlt, -1, 1));
  const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat)) / (Math.cos(alt) * Math.cos(lat));
  let az = Math.acos(clamp(cosAz, -1, 1));
  if (Math.sin(ha) > 0) az = 2 * Math.PI - az;
  return { alt, az };
}

function altAzToVec(alt, az) {
  return [Math.cos(alt) * Math.sin(az), Math.sin(alt), -Math.cos(alt) * Math.cos(az)];
}

/* Kepler solver for asteroid positions */
function solveKepler(M, e) {
  let E = M;
  for (let i = 0; i < 8; i++) E = E - (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
  return E;
}

function asteroidHeliocentric(el, jd) {
  const [name, a, e, iDeg, OmDeg, wDeg, M0Deg] = el;
  const n = 0.9856076686 / Math.pow(a, 1.5); // deg/day
  const M = ((M0Deg + n * (jd - 2451545.0)) % 360 + 360) % 360 * DEG;
  const E = solveKepler(M, e);
  const xv = a * (Math.cos(E) - e);
  const yv = a * Math.sqrt(1 - e * e) * Math.sin(E);
  const v = Math.atan2(yv, xv);
  const r = Math.hypot(xv, yv);

  const w = wDeg * DEG, Om = OmDeg * DEG, inc = iDeg * DEG;
  const cosVw = Math.cos(v + w), sinVw = Math.sin(v + w);
  const cosOm = Math.cos(Om), sinOm = Math.sin(Om);
  const cosInc = Math.cos(inc), sinInc = Math.sin(inc);

  const x = r * (cosOm * cosVw - sinOm * sinVw * cosInc);
  const y = r * (sinOm * cosVw + cosOm * sinVw * cosInc);
  const z = r * (sinVw * sinInc);

  return { x, y, z };
}

function asteroidGeocentricRaDec(el, date) {
  const jd = Astronomy.MakeTime(date).tt;
  const helio = asteroidHeliocentric(el, jd);
  // Earth heliocentric position (ecliptic J2000 approx)
  const earth = Astronomy.HelioVector(Astronomy.Body.Earth, date);
  const gx = helio.x - earth.x;
  const gy = helio.y - earth.y;
  const gz = helio.z - earth.z;
  // rotate ecliptic → equatorial (obliquity ~23.439°)
  const obl = 23.439 * DEG;
  const xe = gx;
  const ye = gy * Math.cos(obl) - gz * Math.sin(obl);
  const ze = gy * Math.sin(obl) + gz * Math.cos(obl);
  const ra = Math.atan2(ye, xe);
  const dec = Math.atan2(ze, Math.hypot(xe, ye));
  return { ra: ((ra / DEG / 15) % 24 + 24) % 24, dec: dec * RAD, dist: Math.hypot(gx, gy, gz) };
}

/* ============================================================
   CAMERA
   ============================================================ */
const F = [0,0,0], R = [0,0,0], UP = [0,0,0];

function basisFromYawPitch() {
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const cy = Math.cos(state.yaw),   sy = Math.sin(state.yaw);
  F[0] = sy * cp; F[1] = sp; F[2] = -cy * cp;
  R[0] = cy;      R[1] = 0;  R[2] = sy;
  UP[0] = R[1]*F[2] - R[2]*F[1];
  UP[1] = R[2]*F[0] - R[0]*F[2];
  UP[2] = R[0]*F[1] - R[1]*F[0];
}

function projectVec(v, W, H) {
  const z = v[0]*F[0] + v[1]*F[1] + v[2]*F[2];
  if (z <= 0.01) return null;
  const x = v[0]*R[0] + v[1]*R[1] + v[2]*R[2];
  const y = v[0]*UP[0] + v[1]*UP[1] + v[2]*UP[2];
  const f = H / (2 * Math.tan(state.fov * 0.5 * DEG));
  return { sx: W/2 + (x / z) * f, sy: H/2 - (y / z) * f, depth: z };
}

/* ============================================================
   OVERLAY RENDER
   ============================================================ */
function drawOverlay(date) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = ovCanvas.width = Math.round(window.innerWidth * dpr);
  const H = ovCanvas.height = Math.round(window.innerHeight * dpr);
  ovCanvas.style.width = window.innerWidth + 'px';
  ovCanvas.style.height = window.innerHeight + 'px';
  ov.setTransform(dpr, 0, 0, dpr, 0, 0);
  ov.clearRect(0, 0, window.innerWidth, window.innerHeight);

  const cw = window.innerWidth, ch = window.innerHeight;
  basisFromYawPitch();

  if (state.ground) drawCardinals(cw, ch);
  if (state.grid) drawGrid(date, cw, ch);
  drawStars(date, cw, ch);
  drawPlanets(date, cw, ch);
  drawDSO(date, cw, ch);
  drawBlackHoles(date, cw, ch);
  drawAsteroids(date, cw, ch);
}

/* ---- Cardinal directions on the horizon ---- */
function drawCardinals(W, H) {
  const dirs = [
    ['N', 0], ['NNE', 22.5], ['NE', 45], ['ENE', 67.5],
    ['E', 90], ['ESE', 112.5], ['SE', 135], ['SSE', 157.5],
    ['S', 180], ['SSW', 202.5], ['SW', 225], ['WSW', 247.5],
    ['W', 270], ['WNW', 292.5], ['NW', 315], ['NNW', 337.5]
  ];

  ov.textAlign = 'center';
  ov.textBaseline = 'middle';

  for (const [label, azDeg] of dirs) {
    const az = azDeg * DEG;
    const v = altAzToVec(0, az);
    const p = projectVec(v, W, H);
    if (!p) continue;
    if (p.sy < 40 || p.sy > H - 40) continue;

    const isCardinal = label.length <= 2;
    const size = isCardinal ? 16 : 9;
    ov.font = `${isCardinal ? '600 ' : ''}${size}px "Avenir Next", system-ui, sans-serif`;
    ov.fillStyle = isCardinal ? 'rgba(255,194,107,0.92)' : 'rgba(141,152,180,0.65)';
    ov.fillText(label, p.sx, p.sy - (isCardinal ? 14 : 8));

    if (isCardinal) {
      // tick mark
      ov.beginPath();
      ov.moveTo(p.sx, p.sy - 4);
      ov.lineTo(p.sx, p.sy + 4);
      ov.strokeStyle = 'rgba(255,194,107,0.55)';
      ov.lineWidth = 1.5;
      ov.stroke();
    }
  }

  // subtle horizon line
  const pts = [];
  for (let az = 0; az < 360; az += 3) {
    const v = altAzToVec(0, az * DEG);
    const p = projectVec(v, W, H);
    if (p) pts.push(p);
  }
  if (pts.length > 1) {
    ov.beginPath();
    ov.moveTo(pts[0].sx, pts[0].sy);
    for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
    ov.strokeStyle = 'rgba(255,194,107,0.18)';
    ov.lineWidth = 1;
    ov.stroke();
  }
}

/* ---- Stars ---- */
function drawStars(date, W, H) {
  for (const [name, raH, decD, mag, spec] of STARS) {
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.05) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, W, H);
    if (!p) continue;

    const r = Math.max(0.6, (6.5 - mag) * 1.4);
    const color = specColor(spec);
    ov.beginPath();
    ov.arc(p.sx, p.sy, r, 0, 2 * Math.PI);
    ov.fillStyle = color;
    ov.shadowColor = color;
    ov.shadowBlur = r * 1.5;
    ov.fill();
    ov.shadowBlur = 0;

    if (state.names && mag < 2.2) {
      ov.font = '11px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = 'rgba(232,236,246,0.82)';
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + r + 3, p.sy - r - 2);
    }
  }
}

function specColor(spec) {
  if (!spec) return '#cfe4ff';
  const c = spec[0].toUpperCase();
  if (c === 'O') return '#9bb0ff';
  if (c === 'B') return '#aabfff';
  if (c === 'A') return '#cad7ff';
  if (c === 'F') return '#f8f7ff';
  if (c === 'G') return '#fff4ea';
  if (c === 'K') return '#ffd2a1';
  if (c === 'M') return '#ffb56b';
  return '#cfe4ff';
}

/* ---- Planets ---- */
const PLANET_BODIES = [
  ['Sun', Astronomy.Body.Sun, '#ffd27a'],
  ['Moon', Astronomy.Body.Moon, '#dbeafe'],
  ['Mercury', Astronomy.Body.Mercury, '#d1d5db'],
  ['Venus', Astronomy.Body.Venus, '#fde68a'],
  ['Mars', Astronomy.Body.Mars, '#fca5a5'],
  ['Jupiter', Astronomy.Body.Jupiter, '#fcd34d'],
  ['Saturn', Astronomy.Body.Saturn, '#fde047'],
  ['Uranus', Astronomy.Body.Uranus, '#a5f3fc'],
  ['Neptune', Astronomy.Body.Neptune, '#93c5fd'],
];

function drawPlanets(date, W, H) {
  for (const [name, body, color] of PLANET_BODIES) {
    let eq;
    try { eq = Astronomy.Equator(body, date, OBSERVER, true, true); }
    catch (_) { continue; }
    const raH = eq.ra / 15, decD = eq.dec;
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.02) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, W, H);
    if (!p) continue;

    const r = name === 'Sun' ? 8 : name === 'Moon' ? 7 : 4;
    ov.beginPath();
    ov.arc(p.sx, p.sy, r, 0, 2 * Math.PI);
    ov.fillStyle = color;
    ov.shadowColor = color;
    ov.shadowBlur = r * 2;
    ov.fill();
    ov.shadowBlur = 0;

    if (state.names) {
      ov.font = 'bold 11px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = color;
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + r + 4, p.sy - r - 2);
    }
  }
}

/* ---- Deep-sky objects ---- */
function drawDSO(date, W, H) {
  for (const [name, raH, decD, mag, type, size] of DSO) {
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.02) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, W, H);
    if (!p) continue;

    const r = type === 'galaxy' ? Math.max(2, Math.log10(size + 1) * 2)
            : type === 'nebula' ? Math.max(2, Math.log10(size + 1) * 1.8)
            : Math.max(1.5, Math.log10(size + 1) * 1.5);

    const col = type === 'nebula' ? 'rgba(103,232,249,0.55)'
              : type === 'galaxy' ? 'rgba(251,113,133,0.50)'
              : 'rgba(255,194,107,0.55)';

    ov.beginPath();
    ov.arc(p.sx, p.sy, r, 0, 2 * Math.PI);
    ov.fillStyle = col;
    ov.fill();
    ov.strokeStyle = col.replace('0.5', '0.9');
    ov.lineWidth = 0.6;
    ov.stroke();

    if (state.names && mag < 8.5) {
      ov.font = '10px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = 'rgba(232,236,246,0.68)';
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + r + 3, p.sy - r - 1);
    }
  }
}

/* ---- Black holes ---- */
function drawBlackHoles(date, W, H) {
  for (const [name, raH, decD] of BLACK_HOLES) {
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.02) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, W, H);
    if (!p) continue;

    ov.beginPath();
    ov.arc(p.sx, p.sy, 4, 0, 2 * Math.PI);
    ov.fillStyle = '#a78bfa';
    ov.shadowColor = '#a78bfa';
    ov.shadowBlur = 12;
    ov.fill();
    ov.shadowBlur = 0;

    if (state.names) {
      ov.font = '10px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = 'rgba(167,139,250,0.85)';
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + 7, p.sy - 5);
    }
  }
}

/* ---- Asteroids ---- */
function drawAsteroids(date, W, H) {
  for (const el of ASTEROIDS) {
    const name = el[0];
    let raDec;
    try { raDec = asteroidGeocentricRaDec(el, date); }
    catch (_) { continue; }
    const { alt, az } = raDecToAltAz(date, raDec.ra, raDec.dec);
    if (alt < -0.02) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, W, H);
    if (!p) continue;

    ov.beginPath();
    ov.arc(p.sx, p.sy, 3, 0, 2 * Math.PI);
    ov.fillStyle = '#fbbf24';
    ov.shadowColor = '#fbbf24';
    ov.shadowBlur = 8;
    ov.fill();
    ov.shadowBlur = 0;
    ov.strokeStyle = 'rgba(251,191,36,0.6)';
    ov.lineWidth = 0.8;
    ov.stroke();

    if (state.names) {
      ov.font = '10px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = 'rgba(251,191,36,0.85)';
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + 6, p.sy - 4);
    }
  }
}

/* ---- RA/Dec + Alt/Az grids ---- */
function drawGrid(date, W, H) {
  ov.lineWidth = 0.5;
  ov.strokeStyle = 'rgba(103,232,249,0.20)';
  ov.font = '9px "Avenir Next", system-ui, sans-serif';
  ov.fillStyle = 'rgba(103,232,249,0.55)';

  for (let raH = 0; raH < 24; raH += 2) {
    const pts = [];
    for (let dec = -80; dec <= 80; dec += 4) {
      const { alt, az } = raDecToAltAz(date, raH, dec);
      const v = altAzToVec(alt, az);
      const p = projectVec(v, W, H);
      if (p) pts.push(p);
    }
    if (pts.length > 1) {
      ov.beginPath();
      ov.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
      ov.stroke();
    }
    if (pts.length) {
      const mid = pts[Math.floor(pts.length / 2)];
      if (mid) ov.fillText((raH + 1) + 'h', mid.sx + 3, mid.sy - 3);
    }
  }

  for (let dec = -75; dec <= 75; dec += 15) {
    const pts = [];
    for (let raH = 0; raH < 24; raH += 0.5) {
      const { alt, az } = raDecToAltAz(date, raH, dec);
      const v = altAzToVec(alt, az);
      const p = projectVec(v, W, H);
      if (p) pts.push(p);
    }
    if (pts.length > 1) {
      ov.beginPath();
      ov.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
      ov.stroke();
    }
    if (pts.length) {
      const mid = pts[Math.floor(pts.length / 2)];
      if (mid) ov.fillText(dec + '°', mid.sx + 3, mid.sy - 3);
    }
  }

  ov.setLineDash([3, 6]);
  ov.strokeStyle = 'rgba(255,194,107,0.22)';
  for (let az = 0; az < 360; az += 30) {
    const pts = [];
    for (let alt = 0; alt <= 85; alt += 3) {
      const v = altAzToVec(alt * DEG, az * DEG);
      const p = projectVec(v, W, H);
      if (p) pts.push(p);
    }
    if (pts.length > 1) {
      ov.beginPath();
      ov.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
      ov.stroke();
    }
  }
  for (let alt = 0; alt <= 85; alt += 30) {
    const pts = [];
    for (let az = 0; az < 360; az += 4) {
      const v = altAzToVec(alt * DEG, az * DEG);
      const p = projectVec(v, W, H);
      if (p) pts.push(p);
    }
    if (pts.length > 1) {
      ov.beginPath();
      ov.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
      ov.stroke();
    }
  }
  ov.setLineDash([]);
}

/* ============================================================
   INFO PANEL – data fetching
   ============================================================ */
const INFO_CACHE = {};

async function fetchPlanetFacts(name) {
  // Use embedded facts immediately, then try a live API for extra depth
  const base = PLANET_FACTS[name] || null;
  if (INFO_CACHE[name]) return INFO_CACHE[name];

  const facts = { ...(base || {}) };

  try {
    // Solar System API (public demo instance) – planets + star
    const res = await fetch('https://solar-system-hackathon-backend.herokuapp.com/stellar/planets');
    if (res.ok) {
      const list = await res.json();
      const hit = list.find(p =>
        (p.englishName || '').toLowerCase() === name.toLowerCase()
      );
      if (hit) {
        facts.radius = hit.meanRadius ? `${hit.meanRadius.toLocaleString()} km` : facts.radius;
        facts.type = hit.planetType || hit.bodyType;
      }
    }
  } catch (_) { /* offline / CORS – embedded data still works */ }

  INFO_CACHE[name] = facts;
  return facts;
}

function showInfo(name, type, extra = {}) {
  state.selected = { name, type };
  infoName.textContent = name;
  infoType.textContent = type;
  infoPanel.classList.add('open');

  // immediately render known extras
  const renderRows = (obj) => {
    infoBody.innerHTML = Object.entries(obj)
      .filter(([, v]) => v !== undefined && v !== null && v !== '')
      .map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`)
      .join('') + (obj.desc ? `<div class="desc">${obj.desc}</div>` : '');
  };

  if (PLANET_FACTS[name]) {
    renderRows({
      'Mean radius': PLANET_FACTS[name].radius,
      'Mass': PLANET_FACTS[name].mass,
      'Day length': PLANET_FACTS[name].day,
      'Orbital period': PLANET_FACTS[name].year,
      'Moons': PLANET_FACTS[name].moons,
      'Temperature': PLANET_FACTS[name].temp,
      ...extra,
      desc: PLANET_FACTS[name].desc
    });

    // async enrich
    fetchPlanetFacts(name).then(f => {
      if (state.selected && state.selected.name === name) {
        renderRows({
          'Mean radius': f.radius,
          'Mass': f.mass || PLANET_FACTS[name].mass,
          'Day length': PLANET_FACTS[name].day,
          'Orbital period': PLANET_FACTS[name].year,
          'Moons': PLANET_FACTS[name].moons,
          'Temperature': PLANET_FACTS[name].temp,
          ...extra,
          desc: PLANET_FACTS[name].desc
        });
      }
    });
  } else {
    renderRows({ ...extra });
  }
}

$('info-close').addEventListener('click', () => {
  infoPanel.classList.remove('open');
  state.selected = null;
});

/* ============================================================
   WEBGL RENDER
   ============================================================ */
let W = 0, H = 0;
const MAX_DPR = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 1.5 : 2;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  const w = Math.max(1, Math.round(glCanvas.clientWidth * dpr));
  const h = Math.max(1, Math.round(glCanvas.clientHeight * dpr));
  if (w !== W || h !== H) {
    W = w; H = h;
    glCanvas.width = W; glCanvas.height = H;
  }
}

const sunV = [0,0,0], moonV = [0,0,0];

function sunDirAt(date, out) {
  const eq = Astronomy.Equator(Astronomy.Body.Sun, date, OBSERVER, true, true);
  const { alt, az } = raDecToAltAz(date, eq.ra / 15, eq.dec);
  const v = altAzToVec(alt, az);
  out[0] = v[0]; out[1] = v[1]; out[2] = v[2];
  return out;
}
function moonDirAt(date, out) {
  const eq = Astronomy.Equator(Astronomy.Body.Moon, date, OBSERVER, true, true);
  const { alt, az } = raDecToAltAz(date, eq.ra / 15, eq.dec);
  const v = altAzToVec(alt, az);
  out[0] = v[0]; out[1] = v[1]; out[2] = v[2];
  return out;
}

function renderGL(now) {
  resize();
  basisFromYawPitch();
  const date = state.observerDate;
  sunDirAt(date, sunV);
  moonDirAt(date, moonV);

  gl.useProgram(prog);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform3f(U.uFwd,   F[0], F[1], F[2]);
  gl.uniform3f(U.uRight, R[0], R[1], R[2]);
  gl.uniform3f(U.uUp,    UP[0], UP[1], UP[2]);
  gl.uniform3f(U.uSun,   sunV[0], sunV[1], sunV[2]);
  gl.uniform3f(U.uMoon,  moonV[0], moonV[1], moonV[2]);
  gl.uniform1f(U.uTanHalf, Math.tan(state.fov * 0.5 * DEG));
  gl.uniform1f(U.uTime, (now - startTime) * 0.001);
  gl.uniform1f(U.uCloud, state.cloud);
  gl.uniform1f(U.uGround, state.ground ? 1 : 0);

  gl.viewport(0, 0, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ============================================================
   TIME
   ============================================================ */
function currentDate() {
  const now = new Date();
  const y = now.getUTCFullYear(), m = now.getUTCMonth(), d = now.getUTCDate();
  const h = state.hour;
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  return new Date(Date.UTC(y, m, d, hh, mm));
}

function updateObserverDate() {
  state.observerDate = currentDate();
  const h = state.hour;
  const hh = Math.floor(h) % 24;
  const mm = Math.floor((h - Math.floor(h)) * 60);
  elTime.textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  slider.value = state.hour.toFixed(2);
}

/* ============================================================
   PICKING (tap objects)
   ============================================================ */
const PICK_OBJECTS = [];

function rebuildPickList(date) {
  PICK_OBJECTS.length = 0;
  const cw = window.innerWidth, ch = window.innerHeight;

  const push = (name, type, raH, decD, color, extra) => {
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.02) return;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, cw, ch);
    if (!p) return;
    PICK_OBJECTS.push({ name, type, sx: p.sx, sy: p.sy, color, extra });
  };

  for (const [name, body, color] of PLANET_BODIES) {
    try {
      const eq = Astronomy.Equator(body, date, OBSERVER, true, true);
      const dist = body === Astronomy.Body.Sun ? null : eq.dist;
      const extra = {};
      if (dist) extra['Distance from Earth'] = dist.toFixed(3) + ' AU';
      if (body === Astronomy.Body.Moon) {
        const ill = Astronomy.Illumination(Astronomy.Body.Moon, date);
        extra['Illumination'] = (ill.phase * 100).toFixed(0) + '%';
      }
      push(name, 'Planet', eq.ra / 15, eq.dec, color, extra);
    } catch (_) {}
  }

  for (const [name, raH, decD, mag, type] of STARS) {
    if (mag > 3.5) continue;
    push(name, type, raH, decD, specColor(type), { 'Visual magnitude': mag });
  }

  for (const [name, raH, decD, mag, type, size] of DSO) {
    if (mag > 8.5) continue;
    push(name, type.charAt(0).toUpperCase() + type.slice(1), raH, decD,
         type === 'nebula' ? '#67e8f9' : type === 'galaxy' ? '#fb7185' : '#ffc26b',
         { 'Visual magnitude': mag, 'Angular size': size + '′' });
  }

  for (const [name, raH, decD] of BLACK_HOLES) {
    push(name, 'Black hole', raH, decD, '#a78bfa', {});
  }

  for (const el of ASTEROIDS) {
    try {
      const rd = asteroidGeocentricRaDec(el, date);
      push(el[0], 'Asteroid', rd.ra, rd.dec, '#fbbf24',
           { 'Diameter': el[7] + ' km', 'Distance from Earth': rd.dist.toFixed(2) + ' AU' });
    } catch (_) {}
  }
}

function handlePick(clientX, clientY) {
  let best = null, bestD = 30;
  for (const o of PICK_OBJECTS) {
    const d = Math.hypot(o.sx - clientX, o.sy - clientY);
    if (d < bestD) { bestD = d; best = o; }
  }
  if (!best) return;

  const date = state.observerDate;
  const extra = { ...best.extra };

  // enrich planets with live data
  if (best.type === 'Planet' && PLANET_FACTS[best.name]) {
    try {
      const bodyMap = {
        Sun: Astronomy.Body.Sun, Moon: Astronomy.Body.Moon,
        Mercury: Astronomy.Body.Mercury, Venus: Astronomy.Body.Venus,
        Mars: Astronomy.Body.Mars, Jupiter: Astronomy.Body.Jupiter,
        Saturn: Astronomy.Body.Saturn, Uranus: Astronomy.Body.Uranus,
        Neptune: Astronomy.Body.Neptune
      };
      const body = bodyMap[best.name];
      if (body) {
        const eq = Astronomy.Equator(body, date, OBSERVER, true, true);
        extra['Distance from Earth'] = (eq.dist * 149597870.7).toLocaleString(undefined, {maximumFractionDigits: 0}) + ' km';
        extra['Right ascension'] = (eq.ra / 15).toFixed(2) + ' h';
        extra['Declination'] = eq.dec.toFixed(1) + '°';
        if (best.name !== 'Sun') {
          const ill = Astronomy.Illumination(body, date);
          extra['Visual magnitude'] = ill.mag.toFixed(1);
        }
      }
    } catch (_) {}
  }

  showInfo(best.name, best.type, extra);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0, startTime = performance.now();
let idleSince = startTime;
let fpsFrames = 0, fpsAcc = 0;
let overlayTimer = 0;

function touched() { idleSince = performance.now(); }

function loop(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 0.016;
  last = now;

  if (state.cycle) {
    state.hour = (state.hour + dt * 0.55) % 24;
    updateObserverDate();
  }

  if (state.drift && !state.gyro && now - idleSince > 1800) {
    state.yaw += dt * 0.05;
  }

  renderGL(now);

  if (now - overlayTimer > 90) {
    overlayTimer = now;
    drawOverlay(state.observerDate);
    rebuildPickList(state.observerDate);
  }

  if (now - (loop._hud || 0) > 150) {
    loop._hud = now;
    const hdg = (Math.atan2(F[0], -F[2]) * RAD + 360) % 360;
    const pit = Math.asin(clamp(F[1], -1, 1)) * RAD;
    const el  = Math.asin(clamp(sunV[1], -1, 1)) * RAD;
    elHdg.textContent = String(Math.round(hdg)).padStart(3,'0') + '°';
    elPit.textContent = (pit >= 0 ? '+' : '−') + String(Math.abs(Math.round(pit))).padStart(2,'0') + '°';
    elSun.textContent = (el >= 0 ? '+' : '−') + String(Math.abs(Math.round(el))).padStart(2,'0') + '°';
  }

  fpsFrames++; fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    elFps.textContent = String(Math.round(fpsFrames / fpsAcc));
    fpsFrames = 0; fpsAcc = 0;
  }

  requestAnimationFrame(loop);
}

/* ============================================================
   INPUT
   ============================================================ */
const pointers = new Map();
let pinchStart = 0;

function pinchDist() {
  const pts = [...pointers.values()];
  if (pts.length < 2) return 0;
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

glCanvas.addEventListener('pointerdown', e => {
  if (state.gyro) return;
  try { glCanvas.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) pinchStart = pinchDist();
  touched();
});

let dragMoved = false;
glCanvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p || state.gyro) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) dragMoved = true;
  if (pointers.size === 1) {
    const k = (state.fov * DEG) / Math.max(1, glCanvas.clientHeight);
    state.yaw   -= dx * k;
    state.pitch  = clamp(state.pitch + dy * k, -1.55, 1.55);
  } else if (pointers.size === 2) {
    const d = pinchDist();
    if (pinchStart > 0 && d > 0) {
      state.fov = clamp(state.fov * (pinchStart / d), 25, 110);
      pinchStart = d;
    }
  }
  touched();
});

function endPointer(e) {
  if (pointers.size === 1 && !dragMoved) {
    handlePick(e.clientX, e.clientY);
  }
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = 0;
  if (pointers.size === 0) dragMoved = false;
}
glCanvas.addEventListener('pointerup', endPointer);
glCanvas.addEventListener('pointercancel', endPointer);
glCanvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const step = 0.06;
  let handled = true;
  switch (e.key) {
    case 'ArrowLeft':  state.yaw -= step; break;
    case 'ArrowRight': state.yaw += step; break;
    case 'ArrowUp':    state.pitch = Math.min(1.55, state.pitch + step); break;
    case 'ArrowDown':  state.pitch = Math.max(-1.55, state.pitch - step); break;
    case 'f': case 'F': toggleFull(); break;
    case 'v': case 'V': toggleVR(); break;
    case 'r': case 'R': resetView(); break;
    case 'g': case 'G': toggleGround(); break;
    case 'c': case 'C': toggleGrid(); break;
    case 'n': case 'N': toggleNames(); break;
    case '+': case '=': state.fov = clamp(state.fov - 4, 25, 110); break;
    case '-': case '_': state.fov = clamp(state.fov + 4, 25, 110); break;
    default: handled = false;
  }
  if (handled) { e.preventDefault(); touched(); }
});

glCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.fov = clamp(state.fov + Math.sign(e.deltaY) * 3, 25, 110);
  touched();
}, { passive: false });

/* ============================================================
   BUTTONS
   ============================================================ */
function toggleVR() {
  state.stereo = !state.stereo;
  $('b-vr').classList.toggle('on', state.stereo);
  if (state.stereo && state.fov > 85) state.fov = 85;
}
function toggleFull() {
  const d = document;
  if (!d.fullscreenElement) {
    (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (()=>{})).call(d.documentElement);
  } else {
    (d.exitFullscreen || d.webkitExitFullscreen || (()=>{})).call(d);
  }
}
function toggleGround() {
  state.ground = !state.ground;
  $('b-ground').classList.toggle('on', state.ground);
}
function toggleGrid() {
  state.grid = !state.grid;
  $('b-grid').classList.toggle('on', state.grid);
}
function toggleNames() {
  state.names = !state.names;
  $('b-names').classList.toggle('on', state.names);
}
function resetView() {
  state.yaw = DEFAULT.yaw;
  state.pitch = DEFAULT.pitch;
  state.fov = DEFAULT.fov;
  state.hour = DEFAULT.hour;
  state.cycle = true;
  state.drift = true;
  state.ground = true;
  state.grid = true;
  state.names = true;
  $('b-cycle').classList.add('on');
  $('b-drift').classList.add('on');
  $('b-ground').classList.add('on');
  $('b-grid').classList.add('on');
  $('b-names').classList.add('on');
  infoPanel.classList.remove('open');
  updateObserverDate();
  touched();
}

$('b-cycle').addEventListener('click', e => {
  state.cycle = !state.cycle;
  e.currentTarget.classList.toggle('on', state.cycle);
});
$('b-drift').addEventListener('click', e => {
  state.drift = !state.drift;
  e.currentTarget.classList.toggle('on', state.drift);
  touched();
});
$('b-ground').addEventListener('click', toggleGround);
$('b-grid').addEventListener('click', toggleGrid);
$('b-names').addEventListener('click', toggleNames);
$('b-now').addEventListener('click', () => {
  const now = new Date();
  state.hour = now.getHours() + now.getMinutes() / 60;
  state.cycle = false;
  $('b-cycle').classList.remove('on');
  updateObserverDate();
});
$('b-gyro').addEventListener('click', () => { /* optional gyro stub */ });
$('b-vr').addEventListener('click', toggleVR);
$('b-full').addEventListener('click', toggleFull);
$('b-reset').addEventListener('click', resetView);

slider.addEventListener('input', () => {
  state.hour = parseFloat(slider.value) || 0;
  state.cycle = false;
  $('b-cycle').classList.remove('on');
  updateObserverDate();
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ============================================================
   BOOT
   ============================================================ */
updateObserverDate();
requestAnimationFrame(now => {
  renderGL(now);
  drawOverlay(state.observerDate);
  requestAnimationFrame(() => veil.classList.add('gone'));
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
