<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#04060c">
<title>Sky VR · Shahdol Sky Atlas</title>
<style>
  :root{
    --bg:#04060c; --ink:#e8ecf6; --mute:#8d98b4; --amber:#ffc26b; --line:#2a3552;
    --glass:rgba(12,17,30,.66); --cyan:#67e8f9; --rose:#fb7185;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 "Avenir Next",system-ui,-apple-system,sans-serif;
    overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #gl,#overlay{position:fixed;inset:0;width:100%;height:100%;display:block}
  #overlay{pointer-events:none}
  #gl{cursor:grab}
  #gl:active{cursor:grabbing}

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;
    display:flex;gap:16px;pointer-events:none;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);
    text-shadow:0 1px 8px #000a; z-index:5;
  }
  #hud div{display:grid;gap:1px}
  #hud span{opacity:.6}
  #hud b{
    color:var(--amber);font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:.06em;font-size:12px;
  }
  #brand{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;
    font-size:11px;letter-spacing:.42em;color:#ffffff55;pointer-events:none;
    text-shadow:0 1px 8px #000a; z-index:5;
  }

  /* ---------- Control bar ---------- */
  #bar{
    position:fixed;left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    display:flex;justify-content:center;padding:0 12px;pointer-events:none;
    z-index:5;
  }
  .panel{
    pointer-events:auto;display:flex;flex-direction:column;gap:10px;
    background:var(--glass);border:1px solid var(--line);border-radius:20px;
    padding:12px 16px;max-width:min(720px,100%);
    backdrop-filter:blur(18px) saturate(1.3);
    -webkit-backdrop-filter:blur(18px) saturate(1.3);
    box-shadow:0 24px 60px -24px #000, inset 0 1px 0 #ffffff14;
  }
  .row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
  .lab{font-size:10px;letter-spacing:.18em;color:var(--mute)}
  .clock{
    color:var(--amber);font-size:12px;font-weight:600;
    font-variant-numeric:tabular-nums;min-width:46px;text-align:right;
  }

  button{
    appearance:none;-webkit-appearance:none;
    background:#0e1424d9;color:var(--ink);
    border:1px solid var(--line);border-radius:999px;
    padding:8px 14px;font:inherit;font-size:13px;letter-spacing:.03em;
    cursor:pointer;
    transition:background .18s,border-color .18s,color .18s,transform .12s;
  }
  button:hover{background:#161f36;border-color:#3d4b70}
  button:active{transform:scale(.95)}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.on{background:#ffc26b1f;border-color:#ffc26b88;color:var(--amber)}

  input[type=range]{
    -webkit-appearance:none;appearance:none;background:transparent;
    flex:1 1 180px;min-width:120px;height:22px;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;
    background:linear-gradient(90deg,#1b2540,#3b4a72 42%,#ffc26b 78%,#2a3552);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;margin-top:-6px;
    border-radius:50%;background:var(--amber);box-shadow:0 0 14px #ffc26b99;
  }
  input[type=range]::-moz-range-track{
    height:4px;border-radius:2px;
    background:linear-gradient(90deg,#1b2540,#3b4a72 42%,#ffc26b 78%,#2a3552);
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border:0;border-radius:50%;
    background:var(--amber);box-shadow:0 0 14px #ffc26b99;
  }

  /* ---------- Intro veil ---------- */
  #veil{
    position:fixed;inset:0;z-index:9;display:grid;place-content:center;
    gap:8px;text-align:center;
    background:radial-gradient(circle at 50% 44%,#0b1224,#04060c 72%);
    transition:opacity .9s ease .1s;
  }
  #veil h1{margin:0;font-size:13px;letter-spacing:.7em;color:var(--amber);font-weight:600}
  #veil p{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
  #veil.gone{opacity:0;pointer-events:none}

  @media (max-width:420px){
    #hud{gap:12px;font-size:9px}
    #hud b{font-size:11px}
    button{padding:7px 11px;font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){
    #veil{transition:none}
    button{transition:none}
  }
</style>
</head>

<canvas id="gl" aria-label="Sky background"></canvas>
<canvas id="overlay" aria-hidden="true"></canvas>

<div id="hud" aria-hidden="true">
  <div><span>HDG</span><b id="v-hdg">000°</b></div>
  <div><span>PITCH</span><b id="v-pit">+00°</b></div>
  <div><span>SUN</span><b id="v-sun">+00°</b></div>

</div>

<div id="brand">SKY&nbsp;VR · SHAHDOL</div>

<div id="bar">
  <div class="panel">
    <div class="row">
      <label class="lab" for="time">TIME</label>
      <input id="time" type="range" min="0" max="24" step="0.01" value="19.15"
             aria-label="Time of day">
      <b class="clock" id="v-time">19:09</b>
      <button id="b-now" title="Jump to the current date &amp; time">Now</button>
    </div>
    <div class="row">
      <button id="b-cycle" class="on" title="Animate the night">Cycle</button>
      <button id="b-drift" class="on" title="Slow camera drift">Drift</button>
      <button id="b-grid" class="on" title="Toggle RA/Dec &amp; Alt/Az grids">Grid</button>
      <button id="b-names" class="on" title="Toggle object labels">Names</button>
      <button id="b-gyro" title="Look with device motion">Gyro</button>
      <button id="b-vr" title="Split-screen stereo">VR</button>
      <button id="b-full" title="Fullscreen">Full</button>
      <button id="b-reset" title="Reset the view">Reset</button>
    </div>
  </div>
</div>

<div id="veil"><h1>SKY VR · SHAHDOL</h1><p>drag to look · pinch to zoom · scientific sky atlas</p></div>

<script type="module">
import * as Astronomy from 'astronomy-engine';

/* ============================================================
   OBSERVER – SHAHDOL, MADHYA PRADESH, INDIA
   ============================================================ */
const OBSERVER = new Astronomy.Observer(23.2936, 81.3619, 468);
const LOC_NAME = 'Shahdol, IN';

/* ============================================================
   DOM
   ============================================================ */
const glCanvas = document.getElementById('gl');
const ovCanvas = document.getElementById('overlay');
const gl = glCanvas.getContext('webgl', {
  alpha: false, antialias: false, depth: false, stencil: false,
  premultipliedAlpha: false, powerPreference: 'high-performance'
});
const ov = ovCanvas.getContext('2d');

const veil = document.getElementById('veil');
const $ = id => document.getElementById(id);
const elHdg = $('v-hdg'), elPit = $('v-pit'), elSun = $('v-sun'),
      elFps = $('v-fps'), elTime = $('v-time'), slider = $('time');

const DEG = Math.PI / 180;
const RAD = 180 / Math.PI;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

/* ============================================================
   STATE
   ============================================================ */
const state = {
  yaw: -1.52,        // azimuth (radians)
  pitch: 0.08,       // altitude (radians)
  fov: 72,           // vertical field of view (degrees)
  hour: 19.15,       // local time
  cloud: 0.55,
  drift: true,
  cycle: true,
  grid: true,
  names: true,
  stereo: false,
  gyro: false,
  observerDate: new Date()
};

const DEFAULT = { yaw: -1.52, pitch: 0.08, fov: 72, hour: 19.15 };

/* ============================================================
   WEBGL SKY BACKGROUND
   ============================================================ */
if (!gl) {
  veil.innerHTML = '<h1>SKY VR</h1><p>WebGL not available</p>';
  throw new Error('WebGL unavailable');
}

const VERT = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FRAG = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform vec2  uRes;
uniform vec3  uFwd, uRight, uUp, uSun, uMoon;
uniform float uTanHalf, uTime, uCloud;

float hash13(vec3 p3){ p3 = fract(p3*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*0.1031); p3 += dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f); float a=hash12(i),b=hash12(i+vec2(1,0)),c=hash12(i+vec2(0,1)),d=hash12(i+vec2(1,1)); return mix(mix(a,b,u.x),mix(c,d,u.x),u.y); }
float fbm(vec2 p){ float v=0.,a=.5; mat2 m=mat2(1.6,1.2,-1.2,1.6); for(int i=0;i<5;i++){v+=a*vnoise(p);p=m*p;a*=.5;} return v; }

void main(){
  float aspect = uRes.x/uRes.y;
  vec2 ndc = vUv*2.0-1.0;
  vec3 dir = normalize(uFwd + uRight*(ndc.x*uTanHalf*aspect) + uUp*(ndc.y*uTanHalf));

  float sunEl = uSun.y;
  float day   = smoothstep(-0.10, 0.25, sunEl);
  float dusk  = smoothstep(-0.42, -0.05, sunEl)*(1.0-smoothstep(-0.02,0.30,sunEl));
  float night = smoothstep(0.08, -0.14, sunEl);

  vec3 zenDay=vec3(0.13,0.33,0.72), zenNight=vec3(0.012,0.020,0.055);
  vec3 horDay=vec3(0.68,0.81,0.95), horNight=vec3(0.030,0.045,0.100);
  vec3 warm=vec3(1.00,0.45,0.14);

  vec3 zen=mix(zenNight,zenDay,day), hor=mix(horNight,horDay,day);
  hor=mix(hor,warm,dusk*0.80); zen=mix(zen,warm*0.55,dusk*0.28);

  float t=clamp(dir.y,0.0,1.0);
  vec3 col=mix(hor,zen,pow(t,0.55));
  float below=smoothstep(0.0,-0.12,dir.y);
  col=mix(col,mix(vec3(0.020,0.026,0.042),vec3(0.10,0.11,0.14),day),below);

  vec3 flatDir=normalize(vec3(dir.x,0.,dir.z)+vec3(1e-5));
  vec3 flatSun=normalize(vec3(uSun.x,0.,uSun.z)+vec3(1e-5));
  float az=max(dot(flatDir,flatSun),0.0);
  col+=warm*pow(az,5.0)*(dusk*0.55+day*0.05)*smoothstep(-0.05,0.18,dir.y);

  float sd=max(dot(dir,uSun),0.0);
  col+=vec3(1.0,0.70,0.34)*pow(sd,8.0)*0.18;
  col+=vec3(1.0,0.92,0.78)*smoothstep(0.99940,0.99985,sd)*5.0*smoothstep(-0.08,0.02,sunEl);

  if(night>0.01 && dir.y>-0.05){
    float st=0.0;
    vec3 p1=dir*60.0; vec3 i1=floor(p1); vec3 f1=fract(p1)-0.5;
    float h1=hash13(i1); if(h1>0.982){ float dd=length(f1); st+=smoothstep(0.30,0.0,dd)*2.4; }
    vec3 p2=dir*140.0; vec3 i2=floor(p2); vec3 f2=fract(p2)-0.5;
    float h2=hash13(i2); if(h2>0.960){ float dd=length(f2); st+=smoothstep(0.24,0.0,dd); }
    st*=night*smoothstep(-0.02,0.14,dir.y);
    col+=vec3(0.84,0.90,1.0)*st*1.5;
  }

  float md=dot(dir,uMoon);
  float moonUp=smoothstep(-0.02,0.10,uMoon.y);
  col+=vec3(0.90,0.93,1.00)*smoothstep(0.99930,0.99975,md)*2.6*moonUp;
  col+=vec3(0.45,0.55,0.85)*pow(max(md,0.),80.)*0.30*moonUp;

  if(uCloud>0.001 && dir.y>0.004){
    vec2 cuv=dir.xz/(dir.y+0.09)*0.62 + vec2(uTime*0.0045,uTime*0.0024);
    float n1=fbm(cuv*1.35), n2=fbm(cuv*3.30+vec2(7.3,2.1));
    float d=n1*0.72+n2*0.34;
    float cov=smoothstep(0.60-uCloud*0.20,0.94-uCloud*0.18,d)*smoothstep(0.,0.18,dir.y);
    if(cov>0.001){
      vec3 cn=normalize(vec3(dir.x,0.42,dir.z));
      vec3 sn=normalize(vec3(uSun.x,0.75,uSun.z));
      float lit=dot(cn,sn)*0.5+0.5;
      vec3 cl=mix(vec3(0.22,0.26,0.38),vec3(1.0,0.96,0.90),lit);
      cl=mix(cl*0.30,cl,day*0.85+dusk*0.45);
      cl=mix(cl,vec3(1.0,0.52,0.24),dusk*0.55*lit);
      cl+=vec3(1.0,0.86,0.62)*pow(sd,24.0)*0.9;
      col=mix(col,cl,cov*0.92);
    }
  }

  vec2 q=vUv-0.5; col*=1.0-dot(q,q)*0.30;
  col+=(hash12(gl_FragCoord.xy+fract(uTime)*61.0)-0.5)*0.006;
  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
}
`;

function makeShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const U = {};
['uRes','uFwd','uRight','uUp','uSun','uMoon','uTanHalf','uTime','uCloud']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

/* ============================================================
   ASTRONOMY HELPERS
   ============================================================ */
function localSiderealTime(date) {
  const jd = Astronomy.MakeTime(date).tt; // Julian day
  const T = (jd - 2451545.0) / 36525.0;
  let gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0)
           + 0.000387933 * T * T - (T * T * T) / 38710000.0;
  gmst = ((gmst % 360) + 360) % 360;
  const lst = (gmst + OBSERVER.longitude) % 360;
  return lst * DEG;
}

/** Convert RA/Dec (J2000) to Alt/Az for observer at date. */
function raDecToAltAz(date, raHours, decDeg) {
  const lst = localSiderealTime(date);
  const ha = lst - (raHours * 15) * DEG; // hour angle
  const dec = decDeg * DEG;
  const lat = OBSERVER.latitude * DEG;

  const sinAlt = Math.sin(dec) * Math.sin(lat)
               + Math.cos(dec) * Math.cos(lat) * Math.cos(ha);
  const alt = Math.asin(clamp(sinAlt, -1, 1));

  const cosAz = (Math.sin(dec) - Math.sin(alt) * Math.sin(lat))
              / (Math.cos(alt) * Math.cos(lat));
  let az = Math.acos(clamp(cosAz, -1, 1));
  if (Math.sin(ha) > 0) az = 2 * Math.PI - az;

  return { alt, az };
}

/** Precess J2000 RA/Dec to date (simple approximation). */
function precess(raHours, decDeg, date) {
  const jd = Astronomy.MakeTime(date).tt;
  const T = (jd - 2451545.0) / 36525.0;
  const ra = raHours * 15 * DEG;
  const dec = decDeg * DEG;
  const zeta = (2306.2181 * T + 0.30188 * T * T) / 3600 * DEG;
  const z = (2306.2181 * T + 1.09468 * T * T) / 3600 * DEG;
  const theta = (2004.3109 * T - 0.42665 * T * T) / 3600 * DEG;

  const A = Math.cos(dec) * Math.sin(ra + zeta);
  const B = Math.cos(theta) * Math.cos(dec) * Math.cos(ra + zeta) - Math.sin(theta) * Math.sin(dec);
  const C = Math.sin(theta) * Math.cos(dec) * Math.cos(ra + zeta) + Math.cos(theta) * Math.sin(dec);

  let raOut = Math.atan2(A, B) + z;
  raOut = ((raOut % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const decOut = Math.asin(clamp(C, -1, 1));
  return { ra: raOut / DEG / 15, dec: decOut * RAD };
}

/* ============================================================
   CAMERA / PROJECTION
   ============================================================ */
const F = [0,0,0], R = [0,0,0], UP = [0,0,0];

function basisFromYawPitch() {
  const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
  const cy = Math.cos(state.yaw),   sy = Math.sin(state.yaw);
  F[0] = sy * cp; F[1] = sp; F[2] = -cy * cp;
  R[0] = cy;      R[1] = 0;  R[2] = sy;
  UP[0] = R[1]*F[2] - R[2]*F[1];
  UP[1] = R[2]*F[0] - R[0]*F[2];
  UP[2] = R[0]*F[1] - R[1]*F[0];
}

function altAzToVec(alt, az) {
  return [
    Math.cos(alt) * Math.sin(az),
    Math.sin(alt),
    -Math.cos(alt) * Math.cos(az)
  ];
}

function projectVec(v, W, H) {
  const z = v[0]*F[0] + v[1]*F[1] + v[2]*F[2];
  if (z <= 0.01) return null;
  const x = v[0]*R[0] + v[1]*R[1] + v[2]*R[2];
  const y = v[0]*UP[0] + v[1]*UP[1] + v[2]*UP[2];
  const f = H / (2 * Math.tan(state.fov * 0.5 * DEG));
  return {
    sx: W/2 + (x / z) * f,
    sy: H/2 - (y / z) * f,
    depth: z
  };
}

/* ============================================================
   RENDER OVERLAY (stars, planets, labels, grid)
   ============================================================ */
const SUN_COLOR = '#ffd27a';
const MOON_COLOR = '#dbeafe';

function drawOverlay(date) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = ovCanvas.width = Math.round(window.innerWidth * dpr);
  const H = ovCanvas.height = Math.round(window.innerHeight * dpr);
  ovCanvas.style.width = window.innerWidth + 'px';
  ovCanvas.style.height = window.innerHeight + 'px';
  ov.setTransform(dpr, 0, 0, dpr, 0, 0);
  ov.clearRect(0, 0, window.innerWidth, window.innerHeight);

  const cw = window.innerWidth, ch = window.innerHeight;

  basisFromYawPitch();

  /* ---------- GRID LINES ---------- */
  if (state.grid) drawGrid(date, cw, ch);

  /* ---------- STARS ---------- */
  for (const [name, raH, decD, mag, spec] of STARS) {
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.05) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, cw, ch);
    if (!p) continue;
    const r = Math.max(0.6, (6.5 - mag) * 1.4);
    const color = specColor(spec);
    ov.beginPath();
    ov.arc(p.sx, p.sy, r, 0, 2 * Math.PI);
    ov.fillStyle = color;
    ov.shadowColor = color;
    ov.shadowBlur = r * 1.5;
    ov.fill();
    ov.shadowBlur = 0;

    if (state.names && mag < 2.2) {
      ov.font = '11px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = 'rgba(232,236,246,0.85)';
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + r + 3, p.sy - r - 2);
    }
  }

  /* ---------- PLANETS ---------- */
  drawPlanets(date, cw, ch);

  /* ---------- DEEP-SKY OBJECTS ---------- */
  for (const [name, raH, decD, mag, type, size] of DSO) {
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.02) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, cw, ch);
    if (!p) continue;

    const r = type === 'galaxy' ? Math.max(2, Math.log10(size + 1) * 2)
            : type === 'nebula' ? Math.max(2, Math.log10(size + 1) * 1.8)
            : Math.max(1.5, Math.log10(size + 1) * 1.5);

    const col = type === 'nebula' ? 'rgba(103,232,249,0.55)'
              : type === 'galaxy' ? 'rgba(251,113,133,0.50)'
              : 'rgba(255,194,107,0.55)';

    ov.beginPath();
    ov.arc(p.sx, p.sy, r, 0, 2 * Math.PI);
    ov.fillStyle = col;
    ov.fill();
    ov.strokeStyle = col.replace('0.5', '0.9');
    ov.lineWidth = 0.6;
    ov.stroke();

    if (state.names && mag < 8.5) {
      ov.font = '10px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = 'rgba(232,236,246,0.70)';
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + r + 3, p.sy - r - 1);
    }
  }

  /* ---------- BLACK HOLES ---------- */
  for (const [name, raH, decD] of BLACK_HOLES) {
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.02) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, cw, ch);
    if (!p) continue;

    ov.beginPath();
    ov.arc(p.sx, p.sy, 4, 0, 2 * Math.PI);
    ov.fillStyle = '#a78bfa';
    ov.shadowColor = '#a78bfa';
    ov.shadowBlur = 10;
    ov.fill();
    ov.shadowBlur = 0;

    if (state.names) {
      ov.font = '10px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = 'rgba(167,139,250,0.85)';
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + 7, p.sy - 5);
    }
  }
}

function specColor(spec) {
  if (!spec) return '#cfe4ff';
  const c = spec[0].toUpperCase();
  if (c === 'O') return '#9bb0ff';
  if (c === 'B') return '#aabfff';
  if (c === 'A') return '#cad7ff';
  if (c === 'F') return '#f8f7ff';
  if (c === 'G') return '#fff4ea';
  if (c === 'K') return '#ffd2a1';
  if (c === 'M') return '#ffb56b';
  return '#cfe4ff';
}

function drawPlanets(date, W, H) {
  const bodies = [
    ['Sun', Astronomy.Body.Sun, '#ffd27a'],
    ['Moon', Astronomy.Body.Moon, MOON_COLOR],
    ['Mercury', Astronomy.Body.Mercury, '#d1d5db'],
    ['Venus', Astronomy.Body.Venus, '#fde68a'],
    ['Mars', Astronomy.Body.Mars, '#fca5a5'],
    ['Jupiter', Astronomy.Body.Jupiter, '#fcd34d'],
    ['Saturn', Astronomy.Body.Saturn, '#fde047'],
    ['Uranus', Astronomy.Body.Uranus, '#a5f3fc'],
    ['Neptune', Astronomy.Body.Neptune, '#93c5fd'],
  ];

  for (const [name, body, color] of bodies) {
    let eq;
    try {
      eq = Astronomy.Equator(body, date, OBSERVER, true, true);
    } catch (_) { continue; }
    const raH = eq.ra / 15;
    const decD = eq.dec;
    const { alt, az } = raDecToAltAz(date, raH, decD);
    if (alt < -0.02) continue;
    const v = altAzToVec(alt, az);
    const p = projectVec(v, W, H);
    if (!p) continue;

    const r = name === 'Sun' ? 8 : name === 'Moon' ? 7 : 4;
    ov.beginPath();
    ov.arc(p.sx, p.sy, r, 0, 2 * Math.PI);
    ov.fillStyle = color;
    ov.shadowColor = color;
    ov.shadowBlur = r * 2;
    ov.fill();
    ov.shadowBlur = 0;

    if (state.names) {
      ov.font = 'bold 11px "Avenir Next", system-ui, sans-serif';
      ov.fillStyle = color;
      ov.textAlign = 'left';
      ov.fillText(name, p.sx + r + 4, p.sy - r - 2);
    }
  }
}

function drawGrid(date, W, H) {
  /* RA/Dec grid: lines of constant RA (every 2h) and constant Dec (every 15°) */
  ov.lineWidth = 0.5;
  ov.strokeStyle = 'rgba(103,232,249,0.20)';
  ov.font = '9px "Avenir Next", system-ui, sans-serif';
  ov.fillStyle = 'rgba(103,232,249,0.55)';

  /* RA meridians */
  for (let raH = 0; raH < 24; raH += 2) {
    const pts = [];
    for (let dec = -80; dec <= 80; dec += 4) {
      const { alt, az } = raDecToAltAz(date, raH, dec);
      const v = altAzToVec(alt, az);
      const p = projectVec(v, W, H);
      if (p) pts.push(p);
    }
    if (pts.length > 1) {
      ov.beginPath();
      ov.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
      ov.stroke();
    }
    if (pts.length) {
      const raLabel = (raH + 1) + 'h';
      const mid = pts[Math.floor(pts.length / 2)];
      if (mid) ov.fillText(raLabel, mid.sx + 3, mid.sy - 3);
    }
  }

  /* Dec parallels */
  for (let dec = -75; dec <= 75; dec += 15) {
    const pts = [];
    for (let raH = 0; raH < 24; raH += 0.5) {
      const { alt, az } = raDecToAltAz(date, raH, dec);
      const v = altAzToVec(alt, az);
      const p = projectVec(v, W, H);
      if (p) pts.push(p);
    }
    if (pts.length > 1) {
      ov.beginPath();
      ov.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
      ov.stroke();
    }
    if (pts.length) {
      const mid = pts[Math.floor(pts.length / 2)];
      if (mid) ov.fillText(dec + '°', mid.sx + 3, mid.sy - 3);
    }
  }

  /* Alt/Az grid (dashed, every 30° azimuth, every 30° altitude) */
  ov.setLineDash([3, 6]);
  ov.strokeStyle = 'rgba(255,194,107,0.22)';
  for (let az = 0; az < 360; az += 30) {
    const pts = [];
    for (let alt = 0; alt <= 85; alt += 3) {
      const v = altAzToVec(alt * DEG, az * DEG);
      const p = projectVec(v, W, H);
      if (p) pts.push(p);
    }
    if (pts.length > 1) {
      ov.beginPath();
      ov.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
      ov.stroke();
    }
  }
  for (let alt = 0; alt <= 85; alt += 30) {
    const pts = [];
    for (let az = 0; az < 360; az += 4) {
      const v = altAzToVec(alt * DEG, az * DEG);
      const p = projectVec(v, W, H);
      if (p) pts.push(p);
    }
    if (pts.length > 1) {
      ov.beginPath();
      ov.moveTo(pts[0].sx, pts[0].sy);
      for (let i = 1; i < pts.length; i++) ov.lineTo(pts[i].sx, pts[i].sy);
      ov.stroke();
    }
  }
  ov.setLineDash([]);
}

/* ============================================================
   WEBGL RENDER
   ============================================================ */
let W = 0, H = 0;
const MAX_DPR = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 1.5 : 2;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
  const w = Math.max(1, Math.round(glCanvas.clientWidth * dpr));
  const h = Math.max(1, Math.round(glCanvas.clientHeight * dpr));
  if (w !== W || h !== H) {
    W = w; H = h;
    glCanvas.width = W; glCanvas.height = H;
  }
}

const sunV = [0,0,0], moonV = [0,0,0];

function sunDirAt(date, out) {
  const eq = Astronomy.Equator(Astronomy.Body.Sun, date, OBSERVER, true, true);
  const raH = eq.ra / 15;
  const decD = eq.dec;
  const { alt, az } = raDecToAltAz(date, raH, decD);
  const v = altAzToVec(alt, az);
  out[0] = v[0]; out[1] = v[1]; out[2] = v[2];
  return out;
}

function moonDirAt(date, out) {
  const eq = Astronomy.Equator(Astronomy.Body.Moon, date, OBSERVER, true, true);
  const raH = eq.ra / 15;
  const decD = eq.dec;
  const { alt, az } = raDecToAltAz(date, raH, decD);
  const v = altAzToVec(alt, az);
  out[0] = v[0]; out[1] = v[1]; out[2] = v[2];
  return out;
}

function renderGL(now) {
  resize();
  basisFromYawPitch();

  const date = state.observerDate;
  sunDirAt(date, sunV);
  moonDirAt(date, moonV);

  gl.useProgram(prog);
  gl.uniform2f(U.uRes, W, H);
  gl.uniform3f(U.uFwd,   F[0], F[1], F[2]);
  gl.uniform3f(U.uRight, R[0], R[1], R[2]);
  gl.uniform3f(U.uUp,    UP[0], UP[1], UP[2]);
  gl.uniform3f(U.uSun,   sunV[0], sunV[1], sunV[2]);
  gl.uniform3f(U.uMoon,  moonV[0], moonV[1], moonV[2]);
  gl.uniform1f(U.uTanHalf, Math.tan(state.fov * 0.5 * DEG));
  gl.uniform1f(U.uTime, (now - startTime) * 0.001);
  gl.uniform1f(U.uCloud, state.cloud);

  gl.viewport(0, 0, W, H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

/* ============================================================
   TIME HANDLING
   ============================================================ */
function currentDate() {
  const now = new Date();
  const y = now.getUTCFullYear(), m = now.getUTCMonth(), d = now.getUTCDate();
  const h = state.hour;
  const hh = Math.floor(h);
  const mm = Math.round((h - hh) * 60);
  return new Date(Date.UTC(y, m, d, hh, mm));
}

function updateObserverDate() {
  state.observerDate = currentDate();
  const h = state.hour;
  const hh = Math.floor(h) % 24;
  const mm = Math.floor((h - Math.floor(h)) * 60);
  elTime.textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  slider.value = state.hour.toFixed(2);
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = 0, startTime = performance.now();
let idleSince = startTime;
let fpsFrames = 0, fpsAcc = 0;
let overlayTimer = 0;

function touched() { idleSince = performance.now(); }

function loop(now) {
  const dt = last ? Math.min((now - last) / 1000, 0.1) : 0.016;
  last = now;

  if (state.cycle) {
    state.hour = (state.hour + dt * 0.55) % 24;
    updateObserverDate();
  }

  if (state.drift && !state.gyro && now - idleSince > 1800) {
    state.yaw += dt * 0.05;
  }

  renderGL(now);

  /* overlay ~12 Hz */
  if (now - overlayTimer > 80) {
    overlayTimer = now;
    drawOverlay(state.observerDate);
  }

  /* HUD */
  if (now - (loop._hud || 0) > 150) {
    loop._hud = now;
    const hdg = (Math.atan2(F[0], -F[2]) * RAD + 360) % 360;
    const pit = Math.asin(clamp(F[1], -1, 1)) * RAD;
    const el  = Math.asin(clamp(sunV[1], -1, 1)) * RAD;
    elHdg.textContent = String(Math.round(hdg)).padStart(3,'0') + '°';
    elPit.textContent = (pit >= 0 ? '+' : '−') + String(Math.abs(Math.round(pit))).padStart(2,'0') + '°';
    elSun.textContent = (el >= 0 ? '+' : '−') + String(Math.abs(Math.round(el))).padStart(2,'0') + '°';
  }

  fpsFrames++; fpsAcc += dt;
  if (fpsAcc >= 0.5) {
    elFps.textContent = String(Math.round(fpsFrames / fpsAcc));
    fpsFrames = 0; fpsAcc = 0;
  }

  requestAnimationFrame(loop);
}

/* ============================================================
   INPUT
   ============================================================ */
const pointers = new Map();
let pinchStart = 0;

function pinchDist() {
  const pts = [...pointers.values()];
  if (pts.length < 2) return 0;
  return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
}

glCanvas.addEventListener('pointerdown', e => {
  if (state.gyro) return;
  try { glCanvas.setPointerCapture(e.pointerId); } catch (_) {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) pinchStart = pinchDist();
  touched();
});

glCanvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p || state.gyro) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    const k = (state.fov * DEG) / Math.max(1, glCanvas.clientHeight);
    state.yaw   -= dx * k;
    state.pitch  = clamp(state.pitch + dy * k, -1.55, 1.55);
  } else if (pointers.size === 2) {
    const d = pinchDist();
    if (pinchStart > 0 && d > 0) {
      state.fov = clamp(state.fov * (pinchStart / d), 25, 110);
      pinchStart = d;
    }
  }
  touched();
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStart = 0;
}
glCanvas.addEventListener('pointerup', endPointer);
glCanvas.addEventListener('pointercancel', endPointer);
glCanvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const step = 0.06;
  let handled = true;
  switch (e.key) {
    case 'ArrowLeft':  state.yaw -= step; break;
    case 'ArrowRight': state.yaw += step; break;
    case 'ArrowUp':    state.pitch = Math.min(1.55, state.pitch + step); break;
    case 'ArrowDown':  state.pitch = Math.max(-1.55, state.pitch - step); break;
    case 'f': case 'F': toggleFull(); break;
    case 'v': case 'V': toggleVR(); break;
    case 'r': case 'R': resetView(); break;
    case 'g': case 'G': toggleGrid(); break;
    case 'n': case 'N': toggleNames(); break;
    case '+': case '=': state.fov = clamp(state.fov - 4, 25, 110); break;
    case '-': case '_': state.fov = clamp(state.fov + 4, 25, 110); break;
    default: handled = false;
  }
  if (handled) { e.preventDefault(); touched(); }
});

glCanvas.addEventListener('wheel', e => {
  e.preventDefault();
  state.fov = clamp(state.fov + Math.sign(e.deltaY) * 3, 25, 110);
  touched();
}, { passive: false });

/* ============================================================
   BUTTONS
   ============================================================ */
function toggleVR() {
  state.stereo = !state.stereo;
  $('b-vr').classList.toggle('on', state.stereo);
  if (state.stereo && state.fov > 85) state.fov = 85;
}
function toggleFull() {
  const d = document;
  if (!d.fullscreenElement) {
    (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (()=>{})).call(d.documentElement);
  } else {
    (d.exitFullscreen || d.webkitExitFullscreen || (()=>{})).call(d);
  }
}
function toggleGrid() {
  state.grid = !state.grid;
  $('b-grid').classList.toggle('on', state.grid);
}
function toggleNames() {
  state.names = !state.names;
  $('b-names').classList.toggle('on', state.names);
}
function resetView() {
  state.yaw = DEFAULT.yaw;
  state.pitch = DEFAULT.pitch;
  state.fov = DEFAULT.fov;
  state.hour = DEFAULT.hour;
  state.cycle = true;
  state.drift = true;
  state.grid = true;
  state.names = true;
  $('b-cycle').classList.add('on');
  $('b-drift').classList.add('on');
  $('b-grid').classList.add('on');
  $('b-names').classList.add('on');
  updateObserverDate();
  touched();
}

$('b-cycle').addEventListener('click', e => {
  state.cycle = !state.cycle;
  e.currentTarget.classList.toggle('on', state.cycle);
});
$('b-drift').addEventListener('click', e => {
  state.drift = !state.drift;
  e.currentTarget.classList.toggle('on', state.drift);
  touched();
});
$('b-grid').addEventListener('click', toggleGrid);
$('b-names').addEventListener('click', toggleNames);
$('b-now').addEventListener('click', () => {
  const now = new Date();
  state.hour = now.getHours() + now.getMinutes() / 60;
  state.cycle = false;
  $('b-cycle').classList.remove('on');
  updateObserverDate();
});
$('b-gyro').addEventListener('click', () => { /* optional gyro: omitted for brevity */ });
$('b-vr').addEventListener('click', toggleVR);
$('b-full').addEventListener('click', toggleFull);
$('b-reset').addEventListener('click', resetView);

slider.addEventListener('input', () => {
  state.hour = parseFloat(slider.value) || 0;
  state.cycle = false;
  $('b-cycle').classList.remove('on');
  updateObserverDate();
});

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ============================================================
   BOOT
   ============================================================ */
updateObserverDate();
requestAnimationFrame(now => {
  renderGL(now);
  drawOverlay(state.observerDate);
  requestAnimationFrame(() => veil.classList.add('gone'));
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
