<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Accurate Celestial VR</title>
  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <!-- Astronomy Engine (VSOP87 planetary theory) -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
    #info-overlay { position: fixed; bottom: 20px; left: 16px; right: 16px; background: rgba(10,10,30,0.95); color: #fff; padding: 16px; border-radius: 12px; display: none; z-index: 10000; border: 1px solid #4af; }
    #close-btn { float: right; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

<div id="info-overlay">
  <button id="close-btn">×</button>
  <h2 id="info-title" style="color:#FFD700; margin:0 0 8px 0;"></h2>
  <p id="info-desc" style="margin:0; font-size:14px; line-height:1.5;"></p>
</div>

<a-scene
  device-orientation-permission-ui="enabled: true"
  background="color: #000005"
  cursor="rayOrigin: mouse"
  raycaster="objects: .clickable; far: 2000">

  <!-- Camera Rig -->
  <a-entity id="rig" position="0 1.6 0">
    <a-entity id="camera" camera look-controls="magicWindowTrackingEnabled: true"></a-entity>
  </a-entity>

  <!-- The Celestial Sphere where all objects will be placed -->
  <a-entity id="celestialSphere"></a-entity>

</a-scene>

<script>
(function() {
  'use strict';

  const SPHERE_RADIUS = 800; // Large enough to feel like the sky
  const celestialSphere = document.getElementById('celestialSphere');
  const infoOverlay = document.getElementById('info-overlay');
  const infoTitle = document.getElementById('info-title');
  const infoDesc = document.getElementById('info-desc');
  document.getElementById('close-btn').onclick = () => { infoOverlay.style.display = 'none'; };

  // -----------------------------------------------------------------
  // 1. HELPER: Convert Right Ascension & Declination to A-Frame Position
  // -----------------------------------------------------------------
  function raDecToPosition(raDeg, decDeg, radius) {
    const ra = raDeg * Math.PI / 180;
    const dec = decDeg * Math.PI / 180;
    // Equatorial to Cartesian (Z-forward convention)
    const x = radius * Math.cos(dec) * Math.cos(ra);
    const y = radius * Math.sin(dec);
    const z = -radius * Math.cos(dec) * Math.sin(ra);
    return `${x} ${y} ${z}`;
  }

  // -----------------------------------------------------------------
  // 2. SAMPLE STAR CATALOG (Real Data from Hipparcos/BSC)
  // -----------------------------------------------------------------
  // RA (degrees), Dec (degrees), Magnitude, Name
  // Source: Yale Bright Star Catalog / Hipparcos
  const stars = [
    { ra: 101.287, dec: -16.716, mag: -1.46, name: "Sirius", desc: "The brightest star in the night sky. A binary system 8.6 light-years away." },
    { ra: 95.988, dec: -52.696, mag: -0.74, name: "Canopus", desc: "Second-brightest star, a white supergiant 310 light-years away." },
    { ra: 210.956, dec: 19.182, mag: -0.05, name: "Arcturus", desc: "A red giant star 37 light-years away, the brightest in the northern celestial hemisphere." },
    { ra: 279.234, dec: 38.784, mag: 0.03, name: "Vega", desc: "A blue-white star 25 light-years away, historically used as a photometric standard." },
    { ra: 88.793, dec: 7.407, mag: 0.08, name: "Rigel", desc: "A blue supergiant in Orion, 860 light-years away." },
    { ra: 78.634, dec: -8.202, mag: 0.13, name: "Betelgeuse", desc: "A red supergiant in Orion, expected to go supernova within 100,000 years." },
    { ra: 24.429, dec: -57.237, mag: 0.46, name: "Achernar", desc: "A rapidly rotating blue star, the brightest in Eridanus." },
    { ra: 68.980, dec: 16.509, mag: 0.87, name: "Aldebaran", desc: "A red giant in Taurus, the 'eye of the bull'." },
    { ra: 247.352, dec: -26.432, mag: 1.06, name: "Antares", desc: "A red supergiant in Scorpius, often called the 'rival of Mars'." },
    { ra: 201.298, dec: -11.161, mag: 1.25, name: "Spica", desc: "A blue giant in Virgo, actually a close binary system." }
  ];

  stars.forEach(star => {
    const pos = raDecToPosition(star.ra, star.dec, SPHERE_RADIUS);
    // Scale visual size by magnitude: brighter (lower mag) = larger
    const visualRadius = 0.5 + Math.max(0, (2.0 - star.mag)) * 1.2;

    const el = document.createElement('a-sphere');
    el.setAttribute('position', pos);
    el.setAttribute('radius', visualRadius);
    el.setAttribute('material', 'color: #ffffff; shader: flat; emissive: #ffffff; emissiveIntensity: 0.8');
    el.classList.add('clickable');
    el.dataset.name = star.name;
    el.dataset.desc = star.desc;
    el.addEventListener('click', () => showInfo(star.name, star.desc));
    celestialSphere.appendChild(el);
  });

  // -----------------------------------------------------------------
  // 3. PLANETS (Real-time positions via Astronomy Engine VSOP87)
  // -----------------------------------------------------------------
  const planetData = {
    Sun:     { color: '#FFD700', desc: "The Sun, a G-type main-sequence star containing 99.86% of the Solar System's mass." },
    Mercury: { color: '#B0B0B0', desc: "The smallest planet, with a highly eccentric orbit and extreme temperature swings." },
    Venus:   { color: '#E8C070', desc: "The hottest planet, with a runaway greenhouse effect and surface pressure 92× Earth's." },
    Mars:    { color: '#C1440E', desc: "The Red Planet, home to Olympus Mons, the largest volcano in the Solar System." },
    Jupiter: { color: '#D8A47F', desc: "The largest planet, a gas giant with a mass greater than all other planets combined." },
    Saturn:  { color: '#F4C430', desc: "A gas giant famous for its extensive ring system made of ice and rock." },
    Uranus:  { color: '#4FD0E7', desc: "An ice giant that rotates on its side, with a unique 98° axial tilt." },
    Neptune: { color: '#4166F5', desc: "The farthest known planet, a deep blue ice giant with the strongest winds in the Solar System." }
  };

  const now = new Date();

  for (const [name, data] of Object.entries(planetData)) {
    try {
      // Get geocentric position vector
      let vec;
      if (name === 'Sun') {
        vec = Astronomy.GeoVector(Astronomy.Body.Sun, now, true);
      } else {
        vec = Astronomy.GeoVector(Astronomy.Body[name], now, true);
      }
      // Convert to equatorial RA/Dec
      const equ = Astronomy.EquatorFromVector(vec);
      const pos = raDecToPosition(equ.ra * 15, equ.dec, SPHERE_RADIUS); // RA is in hours, convert to degrees

      const el = document.createElement('a-sphere');
      el.setAttribute('position', pos);
      // Planets are brighter than stars; give them a slightly larger radius
      el.setAttribute('radius', name === 'Sun' ? 12 : (name === 'Jupiter' ? 6 : 4));
      el.setAttribute('material', `color: ${data.color}; emissive: ${data.color}; emissiveIntensity: 1.2; shader: standard`);
      el.classList.add('clickable');
      el.dataset.name = name;
      el.dataset.desc = data.desc;
      el.addEventListener('click', () => showInfo(name, data.desc));
      celestialSphere.appendChild(el);
    } catch (e) {
      console.warn(`Could not compute position for ${name}:`, e);
    }
  }

  // -----------------------------------------------------------------
  // 4. UI
  // -----------------------------------------------------------------
  function showInfo(name, desc) {
    infoTitle.textContent = name;
    infoDesc.textContent = desc;
    infoOverlay.style.display = 'block';
  }

})();
</script>
</body>
</html>
